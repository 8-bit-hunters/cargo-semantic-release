repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        # Doorstop writes its item files without a trailing newline and rewrites them on
        # every validation run, so leave `plm/` to Doorstop.
        exclude: ^plm/
      - id: trailing-whitespace
        exclude: ^plm/
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: cargo-check
      - id: clippy
  - repo: local
    hooks:
      - id: cargo-spellcheck
        name: cargo-spellcheck
        description: Spellcheck rust files
        entry: cargo-spellcheck
        language: rust
        types: [ rust ]
        args: [ "--code=99", "--" ]
