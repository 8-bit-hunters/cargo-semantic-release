baseURL: https://example.org/
locale: en-us
title: Cargo Semantic Release
module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: ../README.md
      target: content/_index.md

params:
  footer:
    enable: true
    displayCopyright: true

menu:
  main:
    - name: Development
      pageRef: /development
    - name: GitHub
      url: "https://github.com/8-bit-hunters/cargo-semantic-release"
      params:
        icon: github
