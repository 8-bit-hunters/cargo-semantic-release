name: Requirements

on: [ "push" ]

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Separate steps on purpose: a failure then names the check that failed. Both run the same
      # commands a contributor runs locally.
      - name: Validate the requirement tree
        run: tools/project req check
      - name: Check the scenarios, the test items and the ADR citations
        run: tools/project trace check
